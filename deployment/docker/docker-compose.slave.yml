# ============================================================
# MTL LDAP — Docker Compose (SLAVE / Parola Reset Portali)
# ============================================================
# Slave sunucusu için tam servis yığını. Son kullanıcı portalı
# olarak hizmet verir; yazma işlemleri master'a yönlendirilir.
#
# Önkoşullar:
#   - Docker Engine 24+ ve Docker Compose v2
#   - /etc/mtl/mtl-ldap.env dosyası hazırlanmış (master URL'i içerir)
#   - /etc/mtl/ssl/ altında TLS sertifikaları
#   - Master sunucu çalışıyor ve erişilebilir
#
# Çalıştırma:
#   docker compose -f docker-compose.slave.yml --env-file /etc/mtl/mtl-ldap.env up -d
# ============================================================

services:

  # --------------------------------------------------------
  # PostgreSQL — slave lokal veritabanı
  # (yalnızca oturum, lokal audit buffer, sınırlı ayarlar)
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mtl-slave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtl_slave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mtl_ldap}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mtl-slave-pg-data:/var/lib/postgresql/data
      - ./schema/mtl_ldap_schema.sql:/docker-entrypoint-initdb.d/01-mtl-ldap.sql:ro
    networks:
      - mtl-slave-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtl_slave}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # Redis — lokal session/cache
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mtl-slave-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - mtl-slave-redis-data:/data
    networks:
      - mtl-slave-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # OpenLDAP — slave (consumer, read-only)
  # Bu OpenLDAP master'dan replike olur ve harici LDAP istemcilerine
  # read-only sorgu sunar. mtl-ldap servisi yazma için doğrudan
  # master OpenLDAP'a (MTL_LDAP_URL) bağlanır.
  # --------------------------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: mtl-slave-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "MTL"
      LDAP_DOMAIN: "${LDAP_DOMAIN:-mtl.local}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=mtl,dc=local}"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
      LDAP_TLS_CRT_FILENAME: "server.pem"
      LDAP_TLS_KEY_FILENAME: "server.key"
      LDAP_TLS_CA_CRT_FILENAME: "mtl-ca.pem"
      KEEP_EXISTING_CONFIG: "true"
      # Bu container ilk açılışta boş başlar; syncrepl yapılandırması
      # production-deployment-guide.md adımlarına göre cn=config'e eklenir.
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - mtl-slave-ldap-data:/var/lib/ldap
      - mtl-slave-ldap-config:/etc/ldap/slapd.d
      - /etc/mtl/ssl:/container/service/slapd/assets/certs:ro
      - ./schema/mtl-openldap-schema.ldif:/etc/ldap/custom-schema/mtl-schema.ldif:ro
    networks:
      - mtl-slave-net
    healthcheck:
      test: ["CMD", "ldapsearch", "-H", "ldap://localhost", "-x", "-b", "${LDAP_BASE_DN:-dc=mtl,dc=local}", "-s", "base"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # mtl-ldap API (Parola Reset Portali)
  # --------------------------------------------------------
  mtl-api:
    image: ${MTL_IMAGE:-mtl-ldap:1.0.0}
    container_name: mtl-ldap-api
    restart: unless-stopped
    environment:
      MTL_NODE_ID: ${MTL_NODE_ID:-mtl-slave-01}
      MTL_PROFILE: SLAVE
      MTL_SECRET_KEY: ${MTL_SECRET_KEY}
      MTL_FERNET_KEY: ${MTL_FERNET_KEY}
      MTL_LISTEN_HOST: "0.0.0.0"
      MTL_LISTEN_PORT: "8000"
      MTL_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mtl_slave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtl_ldap}
      MTL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # KRİTİK: Slave yazma için master OpenLDAP'a bağlanır
      MTL_LDAP_URL: ${MTL_LDAP_URL}                    # ldaps://mtl-master-01.mtl.local:636
      # Okuma için lokal slave OpenLDAP (opsiyonel)
      MTL_LDAP_READ_URL: ldaps://openldap:636
      MTL_LDAP_BIND_DN: cn=admin,${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MTL_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_CA_PATH: /etc/mtl/ssl/mtl-ca.pem
      MTL_LDAP_TLS_VERIFY: "true"
      # Master ile log shipping ve cluster iletişimi
      MTL_MASTER_URL: ${MTL_MASTER_URL}                # https://mtl-master-01.mtl.local
      MTL_CLUSTER_SECRET: ${MTL_CLUSTER_SECRET}
    volumes:
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
    networks:
      - mtl-slave-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # mtl-ldap Celery worker — log shipping ve lokal görevler
  # --------------------------------------------------------
  mtl-worker:
    image: ${MTL_IMAGE:-mtl-ldap:1.0.0}
    container_name: mtl-ldap-worker
    restart: unless-stopped
    command: celery -A mtl.workers.celery_app worker -B -l info -c 2
    # -B parametresi worker ve beat'i tek process'te çalıştırır (slave'de az iş olduğu için)
    environment:
      MTL_NODE_ID: ${MTL_NODE_ID:-mtl-slave-01}
      MTL_PROFILE: SLAVE
      MTL_SECRET_KEY: ${MTL_SECRET_KEY}
      MTL_FERNET_KEY: ${MTL_FERNET_KEY}
      MTL_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mtl_slave}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtl_ldap}
      MTL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MTL_LDAP_URL: ${MTL_LDAP_URL}
      MTL_LDAP_READ_URL: ldaps://openldap:636
      MTL_LDAP_BIND_DN: cn=admin,${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MTL_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_CA_PATH: /etc/mtl/ssl/mtl-ca.pem
      MTL_MASTER_URL: ${MTL_MASTER_URL}
      MTL_CLUSTER_SECRET: ${MTL_CLUSTER_SECRET}
    volumes:
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
    networks:
      - mtl-slave-net
    depends_on:
      mtl-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # Nginx — TLS sonlandırma ve statik portal dosyaları
  # --------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mtl-slave-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/mtl-ldap.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
      - mtl-slave-frontend-portal:/usr/share/nginx/html:ro
    networks:
      - mtl-slave-net
    depends_on:
      - mtl-api
    security_opt:
      - no-new-privileges:true

networks:
  mtl-slave-net:
    driver: bridge

volumes:
  mtl-slave-pg-data:
  mtl-slave-redis-data:
  mtl-slave-ldap-data:
  mtl-slave-ldap-config:
  mtl-slave-frontend-portal:
