# ============================================================
# MTL LDAP Admin — Docker Compose (MASTER)
# ============================================================
# Master sunucusu için tam servis yığını.
#
# Önkoşullar:
#   - Docker Engine 24+ ve Docker Compose v2
#   - /etc/mtl/mtl-ldap-admin.env dosyası hazırlanmış
#   - /etc/mtl/ssl/ altında TLS sertifikaları
#   - mtl-ldap-admin:1.0.0 image build edilmiş veya registry'den erişilebilir
#
# Çalıştırma:
#   docker compose -f docker-compose.master.yml --env-file /etc/mtl/mtl-ldap-admin.env up -d
# ============================================================

services:

  # --------------------------------------------------------
  # PostgreSQL — uygulama veritabanı
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mtl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mtl_admin}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mtl-pg-data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    networks:
      - mtl-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtl_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # Redis — cache, session, Celery broker
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mtl-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - mtl-redis-data:/data
    networks:
      - mtl-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # OpenLDAP — slapd (master, syncprov provider)
  # --------------------------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: mtl-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "MTL"
      LDAP_DOMAIN: "${LDAP_DOMAIN:-mtl.local}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-dc=mtl,dc=local}"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD}
      LDAP_TLS_CRT_FILENAME: "server.pem"
      LDAP_TLS_KEY_FILENAME: "server.key"
      LDAP_TLS_CA_CRT_FILENAME: "mtl-ca.pem"
      LDAP_TLS_VERIFY_CLIENT: try
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "true"
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - mtl-ldap-data:/var/lib/ldap
      - mtl-ldap-config:/etc/ldap/slapd.d
      - mtl-ldap-accesslog:/var/lib/ldap-accesslog
      - /etc/mtl/ssl:/container/service/slapd/assets/certs:ro
      - ./schema/mtl-openldap-schema.ldif:/etc/ldap/custom-schema/mtl-schema.ldif:ro
    networks:
      - mtl-net
    healthcheck:
      test: ["CMD", "ldapsearch", "-H", "ldap://localhost", "-x", "-b", "${LDAP_BASE_DN:-dc=mtl,dc=local}", "-s", "base"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # mtl-ldap-admin API
  # --------------------------------------------------------
  mtl-api:
    image: ${MTL_IMAGE:-mtl-ldap-admin:1.0.0}
    container_name: mtl-ldap-admin-api
    restart: unless-stopped
    environment:
      MTL_NODE_ID: ${MTL_NODE_ID:-mtl-master-01}
      MTL_PROFILE: MASTER
      MTL_SECRET_KEY: ${MTL_SECRET_KEY}
      MTL_FERNET_KEY: ${MTL_FERNET_KEY}
      MTL_LISTEN_HOST: "0.0.0.0"
      MTL_LISTEN_PORT: "8000"
      MTL_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mtl_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtl_admin}
      MTL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MTL_LDAP_URL: ldaps://openldap:636
      MTL_LDAP_BIND_DN: cn=admin,${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MTL_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_CA_PATH: /etc/mtl/ssl/mtl-ca.pem
      MTL_LDAP_TLS_VERIFY: "true"
      MTL_CLUSTER_SECRET: ${MTL_CLUSTER_SECRET}
      MTL_BOOTSTRAP_ADMIN_USERNAME: ${MTL_BOOTSTRAP_ADMIN_USERNAME:-happy}
      MTL_BOOTSTRAP_ADMIN_PASSWORD: ${MTL_BOOTSTRAP_ADMIN_PASSWORD}
      MTL_BOOTSTRAP_ADMIN_EMAIL: ${MTL_BOOTSTRAP_ADMIN_EMAIL:-happy@mtl.local}
    volumes:
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
      - mtl-backups:/var/lib/mtl/backups
    networks:
      - mtl-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # mtl-ldap-admin Celery worker
  # --------------------------------------------------------
  mtl-worker:
    image: ${MTL_IMAGE:-mtl-ldap-admin:1.0.0}
    container_name: mtl-ldap-admin-worker
    restart: unless-stopped
    command: celery -A mtl.workers.celery_app worker -l info -c 4
    environment:
      MTL_NODE_ID: ${MTL_NODE_ID:-mtl-master-01}
      MTL_PROFILE: MASTER
      MTL_SECRET_KEY: ${MTL_SECRET_KEY}
      MTL_FERNET_KEY: ${MTL_FERNET_KEY}
      MTL_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mtl_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtl_admin}
      MTL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MTL_LDAP_URL: ldaps://openldap:636
      MTL_LDAP_BIND_DN: cn=admin,${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MTL_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_CA_PATH: /etc/mtl/ssl/mtl-ca.pem
      MTL_CLUSTER_SECRET: ${MTL_CLUSTER_SECRET}
    volumes:
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
      - mtl-backups:/var/lib/mtl/backups
    networks:
      - mtl-net
    depends_on:
      mtl-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # Celery beat (zamanlanmış görevler)
  # --------------------------------------------------------
  mtl-beat:
    image: ${MTL_IMAGE:-mtl-ldap-admin:1.0.0}
    container_name: mtl-ldap-admin-beat
    restart: unless-stopped
    command: celery -A mtl.workers.celery_app beat -l info
    environment:
      MTL_NODE_ID: ${MTL_NODE_ID:-mtl-master-01}
      MTL_PROFILE: MASTER
      MTL_SECRET_KEY: ${MTL_SECRET_KEY}
      MTL_FERNET_KEY: ${MTL_FERNET_KEY}
      MTL_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mtl_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mtl_admin}
      MTL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MTL_LDAP_URL: ldaps://openldap:636
      MTL_LDAP_BIND_DN: cn=admin,${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      MTL_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=mtl,dc=local}
      MTL_LDAP_CA_PATH: /etc/mtl/ssl/mtl-ca.pem
      MTL_CLUSTER_SECRET: ${MTL_CLUSTER_SECRET}
    volumes:
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
    networks:
      - mtl-net
    depends_on:
      mtl-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # Nginx — TLS sonlandırma ve statik dosyalar
  # --------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: mtl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/mtl-ldap-admin.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/mtl/ssl:/etc/mtl/ssl:ro
      - mtl-frontend-console:/usr/share/nginx/html:ro
    networks:
      - mtl-net
    depends_on:
      - mtl-api
    security_opt:
      - no-new-privileges:true

networks:
  mtl-net:
    driver: bridge

volumes:
  mtl-pg-data:
  mtl-redis-data:
  mtl-ldap-data:
  mtl-ldap-config:
  mtl-ldap-accesslog:
  mtl-backups:
  mtl-frontend-console:
