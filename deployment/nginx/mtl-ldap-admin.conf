# ============================================================
# MTL LDAP Admin — Nginx Sunucu Yapılandırması (MASTER)
# ============================================================
# MTL Console (yönetici paneli) için reverse proxy ve TLS sonlandırma.
# Yer: /etc/nginx/sites-available/mtl-ldap-admin.conf
# ============================================================

# Rate limiting zone'ları
limit_req_zone $binary_remote_addr zone=mtl_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mtl_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=mtl_general:10m rate=600r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=mtl_conn:10m;

# Upstream — MTL API (uvicorn)
upstream mtl_ldap_admin_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name mtl-master-01.mtl.local;
    
    # Let's Encrypt veya benzeri için acme-challenge istisnası
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Ana HTTPS sunucu
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtl-master-01.mtl.local;
    
    # TLS sertifikası
    ssl_certificate     /etc/mtl/ssl/server.pem;
    ssl_certificate_key /etc/mtl/ssl/server.key;
    
    # TLS yapılandırma — Mozilla "intermediate" profili
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Güvenlik header'ları
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Hassas header'ları gizle
    proxy_hide_header X-Powered-By;
    server_tokens off;
    
    # Bağlantı sınırı (DoS savunması)
    limit_conn mtl_conn 50;
    
    # Body size sınırı (toplu içe aktarım için biraz cömert)
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    
    # Logs
    access_log /var/log/nginx/mtl-ldap-admin.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/mtl-ldap-admin.error.log warn;
    
    # ----------------------------------------------------
    # Statik frontend (MTL Console)
    # ----------------------------------------------------
    root /opt/mtl/frontend/console/dist;
    index index.html;
    
    location / {
        limit_req zone=mtl_general burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        
        # SPA için index.html cache'lenmemeli
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
    
    # Static assets — uzun cache
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # ----------------------------------------------------
    # API endpoint'leri
    # ----------------------------------------------------
    location /api/ {
        limit_req zone=mtl_api burst=50 nodelay;
        
        proxy_pass http://mtl_ldap_admin_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        
        # Buffer yapılandırması
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
    
    # Login endpoint için sıkı rate limit
    location = /api/v1/auth/login {
        limit_req zone=mtl_login burst=3 nodelay;
        
        proxy_pass http://mtl_ldap_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # WebSocket gerçek zamanlı akış
    location /api/v1/realtime/stream {
        proxy_pass http://mtl_ldap_admin_api;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Health endpoint'leri (kimlik doğrulamasız, sadece dahili)
    location = /healthz {
        access_log off;
        proxy_pass http://mtl_ldap_admin_api/healthz;
        allow 127.0.0.1;
        allow ::1;
        # Yük dengeleyici varsa IP allow listesine eklenir
        deny all;
    }
    
    location = /readyz {
        access_log off;
        proxy_pass http://mtl_ldap_admin_api/readyz;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    
    # Prometheus metrik endpoint'i — sadece dahili network
    location = /metrics {
        access_log off;
        proxy_pass http://mtl_ldap_admin_api/metrics;
        # Sadece iç ağdan erişim — kuruluş CIDR'iyle değiştirin
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # OpenAPI sadece yetkili kullanıcıların
    location = /api/v1/openapi.json {
        proxy_pass http://mtl_ldap_admin_api;
    }
    
    # Swagger UI üretimde devre dışı (geliştirmede aktif)
    location = /docs {
        return 404;
    }
    location = /redoc {
        return 404;
    }
    
    # Hassas yolları gizle
    location ~* /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }
}
