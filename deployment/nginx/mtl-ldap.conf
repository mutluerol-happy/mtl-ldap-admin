# ============================================================
# MTL LDAP — Nginx Sunucu Yapılandırması (SLAVE / Parola Reset Portali)
# ============================================================
# MTL Parola Reset için reverse proxy ve TLS sonlandırma.
# Yer: /etc/nginx/sites-available/mtl-ldap.conf
# ============================================================

# Rate limiting zone'ları — slave için biraz daha gevşek (son kullanıcı trafiği)
limit_req_zone $binary_remote_addr zone=mtl_slave_login:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=mtl_slave_recovery:10m rate=5r/h;
limit_req_zone $binary_remote_addr zone=mtl_slave_api:10m rate=200r/m;
limit_req_zone $binary_remote_addr zone=mtl_slave_general:10m rate=600r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=mtl_slave_conn:10m;

# Upstream
upstream mtl_ldap_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name mtl-slave-01.mtl.local;
    
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtl-slave-01.mtl.local;
    
    ssl_certificate     /etc/mtl/ssl/server.pem;
    ssl_certificate_key /etc/mtl/ssl/server.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Güvenlik header'ları
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    proxy_hide_header X-Powered-By;
    server_tokens off;
    
    limit_conn mtl_slave_conn 50;
    
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    access_log /var/log/nginx/mtl-ldap.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/mtl-ldap.error.log warn;
    
    # ----------------------------------------------------
    # Statik frontend (MTL Parola Reset)
    # ----------------------------------------------------
    root /opt/mtl/frontend/reset-password/dist;
    index index.html;
    
    location / {
        limit_req zone=mtl_slave_general burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
    
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # ----------------------------------------------------
    # Parola Reset API endpoint'leri
    # ----------------------------------------------------
    location /api/ {
        limit_req zone=mtl_slave_api burst=50 nodelay;
        
        proxy_pass http://mtl_ldap_api;
        proxy_http_version 1.1;
        
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
    
    # Login endpoint için sıkı limit
    location = /api/v1/reset-password/login {
        limit_req zone=mtl_slave_login burst=3 nodelay;
        
        proxy_pass http://mtl_ldap_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Parola sıfırlama için saatlik limit
    location ~ ^/api/v1/recovery/(request|verify-otp) {
        limit_req zone=mtl_slave_recovery burst=2 nodelay;
        
        proxy_pass http://mtl_ldap_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Cluster API endpoint'leri — slave bunları sunmaz
    location /api/v1/cluster/ {
        return 404;
    }
    
    # Yönetici endpoint'leri slave'de yok
    location ~ ^/api/v1/(identity|rbac|sync|shield|backup|audit|signal|settings)/ {
        # Bu yollar slave profilinde backend tarafında zaten 404 dönüyor,
        # nginx seviyesinde de açıkça reddedelim ki yanlışlıkla render etmesin
        return 404;
    }
    
    # Health endpoint'leri — sadece dahili
    location = /healthz {
        access_log off;
        proxy_pass http://mtl_ldap_api/healthz;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    
    location = /readyz {
        access_log off;
        proxy_pass http://mtl_ldap_api/readyz;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    
    # Metrik endpoint'i — sadece dahili
    location = /metrics {
        access_log off;
        proxy_pass http://mtl_ldap_api/metrics;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    
    # Swagger / Redoc kapalı
    location = /docs   { return 404; }
    location = /redoc  { return 404; }
    
    location ~* /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }
}
