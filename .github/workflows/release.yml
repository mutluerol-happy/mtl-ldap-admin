name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Build backend (linux/amd64)
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o mtl-ldap-admin ./cmd/server

      - name: Create tarball
        run: |
          mkdir -p release/mtl-ldap-admin-${{ github.ref_name }}
          cp mtl-ldap-admin release/mtl-ldap-admin-${{ github.ref_name }}/
          cp -r web/dist release/mtl-ldap-admin-${{ github.ref_name }}/web-dist
          cp -r install release/mtl-ldap-admin-${{ github.ref_name }}/
          cp -r docs release/mtl-ldap-admin-${{ github.ref_name }}/
          cp README.md LICENSE NOTICE CONTRIBUTING.md release/mtl-ldap-admin-${{ github.ref_name }}/
          cd release
          tar -czf mtl-ldap-admin-${{ github.ref_name }}-linux-amd64.tar.gz \
            mtl-ldap-admin-${{ github.ref_name }}/
          sha256sum mtl-ldap-admin-${{ github.ref_name }}-linux-amd64.tar.gz \
            > mtl-ldap-admin-${{ github.ref_name }}-linux-amd64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mtl-ldap-admin-${{ github.ref_name }}-linux-amd64.tar.gz
            release/mtl-ldap-admin-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
